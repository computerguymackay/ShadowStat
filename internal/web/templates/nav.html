{{define "nav"}}
<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="/">ShadowStat</a>
    <nav class="nav-links">
      <a href="/" class="nav-link{{if not .Breadcrumb}} active{{end}}">Hosts</a>
      {{if .IsAdmin}}<a href="/settings" class="nav-link{{if .OnSettingsPage}} active{{end}}">Settings</a>{{end}}
    </nav>
    {{if .Breadcrumb}}<span class="crumb-sep" aria-hidden="true">/</span><span class="crumb">{{.Breadcrumb}}</span>{{end}}

  <button id="logout-btn" class="logout-btn" type="button" aria-label="Log out">Log out</button>
</header>
{{end}}
