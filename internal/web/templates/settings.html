{{define "settings.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShadowStat — Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "nav" .}}
  <main>
    <h1 class="page-title">Settings</h1>

    <section>
      <h2 class="section-title">Capture</h2>
      <form id="general-settings-form" class="settings-form">
        <label>Capture interface
          <select name="capture_interface" id="capture-interface-select"></select>
        </label>
        <label>LAN subnet (CIDR)
          <input type="text" name="lan_subnet_cidr" id="lan-subnet-input" placeholder="192.168.1.0/24">
        </label>
        <label>Retention window
          <select name="retention_days" id="retention-select">
            <option value="7">1 week</option>
            <option value="30">1 month</option>
            <option value="90">90 days</option>
            <option value="365">1 year</option>
          </select>
        </label>
        <p id="general-settings-note" class="form-note"></p>
        <button type="submit">Save capture settings</button>
      </form>
    </section>

    <section>
      <h2 class="section-title">Detection</h2>
      <form id="detector-settings-form" class="settings-form">
        <label class="checkbox-row"><input type="checkbox" name="detector_new_destination_enabled" checked> New destinations</label>
        <label class="checkbox-row"><input type="checkbox" name="detector_beaconing_enabled" checked> Beaconing</label>
        <label class="checkbox-row"><input type="checkbox" name="detector_exfil_ratio_enabled" checked> Upload/download ratio</label>
        <label class="checkbox-row"><input type="checkbox" name="detector_dns_anomaly_enabled" checked> DNS anomaly</label>
        <label class="checkbox-row"><input type="checkbox" name="detector_port_scan_enabled" checked> Port scan</label>
        <p id="detector-settings-note" class="form-note"></p>
        <button type="submit">Save detector settings</button>
      </form>
    </section>

    <section>
      <h2 class="section-title">Users</h2>
      <table id="user-table" class="data-table">
        <thead>
          <tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="user-table-body"></tbody>
      </table>

      <h3 class="subsection-title">Add user</h3>
      <form id="add-user-form" class="settings-form">
        <label>Username <input type="text" name="username" autocomplete="off" required></label>
        <label>Password <input type="password" name="password" autocomplete="new-password" required minlength="12"></label>
        <label>Role
          <select name="role">
            <option value="standard">Standard (view only)</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <p id="add-user-note" class="form-note"></p>
        <button type="submit">Add user</button>
      </form>
    </section>
  </main>

  <div id="reauth-modal" class="modal-overlay" hidden>
    <form id="reauth-form" class="modal-box">
      <h2>Re-enter your password</h2>
      <p class="muted">Settings changes require confirming it's really you.</p>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <p id="reauth-note" class="form-note"></p>
      <div class="modal-actions">
        <button type="button" id="reauth-cancel-btn" class="secondary-btn">Cancel</button>
        <button type="submit">Confirm</button>
      </div>
    </form>
  </div>

  <script src="/static/app.js"></script>
  <script>ShadowStat.initSettings();</script>
</body>
</html>
{{end}}
