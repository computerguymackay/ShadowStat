name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          # GOOS/GOARCH/GOARM combos to publish. All pure Go (modernc.org/sqlite,
          # gopacket/pcapgo) — CGO_ENABLED=0 cross-compiles cleanly with no
          # cross-toolchain needed, which is the whole point of shipping these:
          # building on-device (e.g. a Raspberry Pi) is slow, this isn't.
          targets="linux/amd64/ linux/arm64/ linux/arm/7 linux/arm/6"
          for t in $targets; do
            os=$(echo "$t" | cut -d/ -f1)
            arch=$(echo "$t" | cut -d/ -f2)
            arm=$(echo "$t" | cut -d/ -f3)

            name="shadowstat-${os}-${arch}"
            ldflags="-s -w -X ShadowStat/internal/version.Version=${VERSION}"
            if [ -n "$arm" ]; then
              name="shadowstat-${os}-${arch}v${arm}"
            fi

            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$arm" \
              go build -trimpath -ldflags "$ldflags" -o "dist/${name}" .

            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            ( cd dist && sha256sum "${name}.tar.gz" >> SHA256SUMS.txt )
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: shadowstat-binaries
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
